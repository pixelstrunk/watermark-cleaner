- id: wmc-fix
  name: wmc mechanical clean
  description: Remove invisible unicode characters, normalize typography, strip image metadata. Never blocks on style.
  entry: wmc fix --no-voice --no-backup --quiet
  language: python
  files: '\.(md|mdx|markdown|txt|html?|svg|png|jpe?g|webp)$'

- id: wmc-check
  name: wmc voice gate
  description: Block the commit when AI phrases or AI sentence shapes are present. Report only, changes nothing.
  entry: wmc check --quiet
  language: python
  files: '\.(md|mdx|markdown|txt|html?)$'
