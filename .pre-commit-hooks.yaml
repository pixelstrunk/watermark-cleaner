- id: watermark-cleaner-fix
  name: watermark-cleaner mechanical clean
  description: Remove invisible unicode characters, normalize typography, strip image metadata. Never blocks on style.
  entry: watermark-cleaner fix --no-voice --no-backup --quiet
  language: python
  files: '\.(md|mdx|markdown|txt|html?|svg|png|jpe?g|webp|docx|odt)$'

- id: watermark-cleaner-check
  name: watermark-cleaner voice gate
  description: Block the commit when AI phrases or AI sentence shapes are present. Report only, changes nothing.
  entry: watermark-cleaner check --quiet
  language: python
  files: '\.(md|mdx|markdown|txt|html?)$'
