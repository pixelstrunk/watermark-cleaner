name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: run python tests
        run: python -m unittest discover -s tests

  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
      - name: run node tests
        run: node node/test/run.js

  rules-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: rule files must be identical in all packages
        run: |
          diff -r rules python/watermark_cleaner/rules_data
          diff -r rules node/rules_data

  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: version must be identical in pyproject, package.json and __init__.py
        run: |
          py=$(grep -E '^version = ' pyproject.toml | cut -d'"' -f2)
          node=$(node -p "require('./node/package.json').version")
          init=$(grep -E '^__version__' python/watermark_cleaner/__init__.py | cut -d'"' -f2)
          echo "pyproject=$py package.json=$node __init__=$init"
          test "$py" = "$node" && test "$py" = "$init"

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
      - name: python and node must produce identical output
        run: bash scripts/check-parity.sh

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
      - name: install python package and smoke test
        run: |
          pip install .
          watermark-cleaner --version
          watermark-cleaner check tests/fixtures/parity || test $? -eq 1
      - name: pack node package and smoke test
        run: |
          npm install -g ./node
          watermark-cleaner --version

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: audit the built package
        run: |
          pip install pip-audit build
          python -m build --wheel
          pip-audit --local || true
          pip install .
          pip-audit --local
